<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ewha Market</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='loginStyle.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Ewha Market에 오신 걸 환영해요!<br>회원님의 계정을 생성해볼까요?</h2>
      <form action="/login" method="post">
        <div class="input-group">
          <label for="user-id">아이디</label>
          <input type="text" id="user-id" name="user-id" placeholder="아이디를 입력해주세요...">
        </div>
        <div class="input-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요...">
        </div>
        <button type="submit" class="login-btn">로그인</button>
      </form>
      <div class="extra-links">
        <a href="/signUp">회원가입</a>
        <a href="/findId">아이디 찾기</a>
      </div>
    </div>
  </div>
</body>
</html>
