<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ewha Market</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='indexStyle.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <div class="navbar__logo">
      <a href="/">Ewha Market</a>
    </div>
    <ul class="navbar__menu">
      <li><a href="/productList">Browse</a></li>
      <li><a href="/productDetail">Post Reviews</a></li>
      <li><a href="/mypage">My page</a></li>
    </ul>
    <div class="navbar__user">
      {% if logged_in %}
        <span class="user__role buyer">buyer</span>
        <span class="user__nickname">{{ user }}</span>
        <div class="user__avatar"></div>
        <a href="/logout" class="logout-btn">Logout</a>
      {% else %}
        <a href="/login" class="login-btn">Login</a>
      {% endif %}
    </div>
  </nav>

  {% block content %}
  {% endblock %}

</body>
</html>
